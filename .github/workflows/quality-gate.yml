name: Quality Gate & Security Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Secret Scanning with Gitleaks
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ----------------------------------------------------------------------------
  # Job 2: Code Quality, Strict Typing, Unit, Integration & E2E Verification
  # ----------------------------------------------------------------------------
  quality-gate:
    name: Verification Gate (Lint, Types, Tests, Build)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    env:
      NODE_ENV: test
      NOTICE_SYNC_TEST_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Dependency security vulnerability audit
        run: pnpm audit --prod --audit-level=high

      - name: Linting check (ESLint)
        run: pnpm run lint

      - name: Static type check (TypeScript strict mode)
        run: pnpm run typecheck

      - name: Unit test suite
        run: pnpm run test:unit

      - name: Integration test suite
        run: pnpm run test:integration

      - name: End-to-end user journey test suite
        run: pnpm run test:e2e

      - name: Complete test suite verification
        run: pnpm test

      - name: Production Next.js build
        run: pnpm run build
